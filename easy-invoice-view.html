<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasyFile Invoice View</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
<link rel="icon" href="logo-b.png" type="image/png">
<style>.card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem}.mono{font-variant-numeric:tabular-nums}@media print{.no-print{display:none!important}body{background:white}}</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
<main class="max-w-4xl mx-auto p-4 md:p-8">
<div class="no-print flex justify-between items-center mb-4"><a href="index.html" class="font-black">EasyFile</a><button onclick="window.print()" class="px-4 py-2 border rounded-lg bg-white">Print / PDF</button></div>
<div id="view" class="card p-6 md:p-10"></div>
<p class="text-xs text-gray-400 mt-4">Read-only shared invoice view. The invoice data is encoded in this link; anyone with the link can read it. Do not use it for confidential information.</p>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function decode(){
 try{
  const raw=new URLSearchParams(location.hash.slice(1)).get("data");
  if(!raw)return null;
  const bin=atob(raw.replace(/-/g,"+").replace(/_/g,"/"));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
 }catch{return null}
}
function money(cur,n){const s={ZAR:"R",USD:"$",EUR:"€",GBP:"£"}[cur]||cur;return s+" "+Number(n||0).toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2})}
const i=decode(),v=document.getElementById("view");
if(!i){v.innerHTML='<h1 class="text-2xl font-black">Invoice link is invalid or incomplete.</h1>'}
else{
 const lines=(i.lines||[]).map(l=>{const ex=Number(l.qty||0)*Number(l.rate||0)*(1-Number(l.disc||0)/100),vat=ex*Number(l.vat||0)/100;return `<tr class="border-b"><td class="py-2">${esc(l.desc)}</td><td class="text-right">${Number(l.qty||0)}</td><td class="text-right">${money(i.currency,l.rate)}</td><td class="text-right">${money(i.currency,ex+vat)}</td></tr>`}).join("");
 v.innerHTML=`
 <div class="flex flex-col md:flex-row justify-between gap-6"><div><h2 class="text-xl font-black">${esc(i.company?.name||"")}</h2><div class="text-sm text-gray-600 whitespace-pre-line">${esc(i.company?.address||"")}</div><div class="text-sm text-gray-600">${esc(i.company?.email||"")} ${esc(i.company?.phone||"")}</div><div class="text-sm text-gray-600">${i.company?.vat?"VAT: "+esc(i.company.vat):""}</div></div><div class="md:text-right"><h1 class="text-3xl font-black">${esc((i.type||"Invoice").toUpperCase())}</h1><div class="mono font-bold">${esc(i.number||"")}</div><div class="text-sm">Issued ${esc(i.issueDate||"")} • Due ${esc(i.dueDate||"")}</div></div></div>
 <div class="grid md:grid-cols-2 gap-4 mt-8"><div class="border rounded-lg p-4"><div class="text-xs text-gray-500 font-bold">BILL TO</div><div class="font-black">${esc(i.client?.name||"")}</div><div class="text-sm text-gray-600 whitespace-pre-line">${esc(i.client?.address||"")}</div><div class="text-sm text-gray-600">${esc(i.client?.email||"")}</div></div><div class="border rounded-lg p-4"><div class="flex justify-between"><span>Total</span><b>${money(i.currency,i.total)}</b></div><div class="flex justify-between"><span>Balance due</span><b>${money(i.currency,i.balance??i.total)}</b></div>${i.paymentUrl?`<a class="mt-3 inline-block px-4 py-2 bg-blue-600 text-white rounded-lg" href="${esc(i.paymentUrl)}" rel="noopener noreferrer">Pay invoice</a>`:""}</div></div>
 <table class="w-full mt-8 text-sm"><thead class="border-b text-left"><tr><th class="py-2">Description</th><th class="text-right">Qty</th><th class="text-right">Rate</th><th class="text-right">Total</th></tr></thead><tbody>${lines}</tbody></table>
 <div class="grid md:grid-cols-2 gap-6 mt-8 text-sm"><div><h3 class="font-black">Notes</h3><div class="whitespace-pre-line text-gray-600">${esc(i.notes||"")}</div></div><div><h3 class="font-black">Payment terms</h3><div class="whitespace-pre-line text-gray-600">${esc(i.terms||"")}</div>${i.company?.bank?`<h3 class="font-black mt-3">Bank details</h3><div class="whitespace-pre-line text-gray-600">${esc(i.company.bank)}</div>`:""}</div></div>`;
}
</script>
<script defer src="scripts/sync-nav.js"></script>
</body></html>
