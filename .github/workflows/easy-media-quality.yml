name: Easy Media quality
on:
  push:
    paths:
      - "easy-media.html"
      - "assets/js/easy-media.js"
      - "scripts/sync-nav.js"
      - "scripts/validate-easy-media.mjs"
      - ".github/workflows/easy-media-quality.yml"
  pull_request:
    paths:
      - "easy-media.html"
      - "assets/js/easy-media.js"
      - "scripts/sync-nav.js"
      - "scripts/validate-easy-media.mjs"
      - ".github/workflows/easy-media-quality.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Easy Media module
        run: node scripts/validate-easy-media.mjs
      - name: Scan for common merge artefacts
        run: |
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' easy-media.html assets/js/easy-media.js scripts/sync-nav.js
