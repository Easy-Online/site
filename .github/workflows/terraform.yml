name: Terraform

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/.terraform.lock.hcl'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/.terraform.lock.hcl'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Terraform configuration
        id: detect
        run: |
          if find . -type f -name '*.tf' -not -path './.terraform/*' -print -quit | grep -q .; then
            echo "has_terraform=true" >> "$GITHUB_OUTPUT"
            echo "Terraform configuration detected."
          else
            echo "has_terraform=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform configuration found; infrastructure checks are not applicable."
          fi

      - name: Setup Terraform
        if: steps.detect.outputs.has_terraform == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        if: steps.detect.outputs.has_terraform == 'true'
        run: terraform init -input=false

      - name: Terraform Format
        if: steps.detect.outputs.has_terraform == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        if: steps.detect.outputs.has_terraform == 'true'
        run: terraform validate -no-color

      - name: Terraform Plan
        if: steps.detect.outputs.has_terraform == 'true'
        run: terraform plan -input=false -no-color

      # Infrastructure changes are intentionally plan-only in CI. Production apply
      # requires a separately controlled and approved deployment procedure.
