name: EasyFile Navigation Enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate canonical navigation in build workspace
        run: node tools/inject-nav.js

      - name: Validate document structure and inline scripts
        run: node tools/validate-html.js

      - name: Install HTMLHint
        run: npm install --global htmlhint

      - name: Validate HTML conventions
        run: htmlhint --config .htmlhintrc ./*.html

      - name: Verify global module menu coverage
        run: node scripts/verify-module-registry.js

      - name: Verify platform conformance
        run: node scripts/verify-platform-conformance.js

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload the exact validated site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: enforce-navigation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy validated artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
