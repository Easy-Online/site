name: EasyFile Navigation Enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enforce-navigation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pull requests are validation-only and use the immutable head SHA.
          # Push events must check out the actual branch so generated changes
          # can be committed and pushed without a detached-HEAD failure.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Inject canonical navigation
        run: node tools/inject-nav.js

      - name: Validate document structure and inline scripts
        run: node tools/validate-html.js

      - name: Install HTMLHint
        run: npm install --global htmlhint

      - name: Validate HTML conventions
        run: htmlhint --config .htmlhintrc ./*.html

      - name: Verify global module menu coverage
        run: node scripts/verify-module-registry.js

      - name: Commit generated navigation updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo "Navigation is already synchronized."
            exit 0
          fi

          git config user.name "easyfile-bot"
          git config user.email "bot@easyfile.local"
          git add -- '*.html'
          git commit -m "chore: synchronize EasyFile navigation"

          # Use an explicit destination ref as an additional safeguard.
          git push origin HEAD:main

  deploy:
    needs: enforce-navigation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout synchronized site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4