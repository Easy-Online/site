name: Deploy EasyFile Referral API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "referral-api/**"
      - ".github/workflows/deploy-referral-api.yml"
  pull_request:
    paths:
      - "referral-api/**"
      - ".github/workflows/deploy-referral-api.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: referral-api
        run: npm install --omit=dev --no-audit --no-fund

      - name: Validate and test referral API
        working-directory: referral-api
        run: npm run check

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      EASYFILE_REFERRAL_HEALTH_URL: ${{ vars.EASYFILE_REFERRAL_HEALTH_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          missing=0
          for name in AZURE_FUNCTIONAPP_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: referral-api
        run: npm install --omit=dev --no-audit --no-fund

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: referral-api

      - name: Verify deployed referral API health
        if: ${{ env.EASYFILE_REFERRAL_HEALTH_URL != '' }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            status=$(curl --silent --show-error --output health.json --write-out "%{http_code}" \
              --max-time 15 "$EASYFILE_REFERRAL_HEALTH_URL" || true)
            cat health.json 2>/dev/null || true

            if [ "$status" = "200" ]; then
              node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("health.json","utf8")); if(h.status!=="ok" || !Array.isArray(h.issues) || h.issues.length!==0) process.exit(1)'
              exit 0
            fi

            if [ "$status" = "503" ]; then
              if node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("health.json","utf8")); const i=Array.isArray(h.issues)?h.issues:[]; if(i.length===1 && i[0]==="email-verification-disabled") process.exit(0); process.exit(1)'; then
                echo "Deployment is healthy but email verification is intentionally not active yet."
                exit 0
              fi
            fi

            echo "Health check attempt $attempt returned HTTP $status."
            sleep 10
          done
          echo "Referral API did not become reachable after deployment."
          exit 1

      - name: Warn when health verification is not configured
        if: ${{ env.EASYFILE_REFERRAL_HEALTH_URL == '' }}
        run: echo "Deployment completed without a health check. Set EASYFILE_REFERRAL_HEALTH_URL."
