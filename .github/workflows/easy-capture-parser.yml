name: Easy Capture parser

on:
  pull_request:
    paths:
      - "assets/js/easy-capture-parser.js"
      - "assets/js/easy-capture-enhancements.js"
      - "tests/easy-capture-parser.test.cjs"
      - ".github/workflows/easy-capture-parser.yml"
  push:
    branches: [main]
    paths:
      - "assets/js/easy-capture-parser.js"
      - "assets/js/easy-capture-enhancements.js"
      - "tests/easy-capture-parser.test.cjs"
      - ".github/workflows/easy-capture-parser.yml"

permissions:
  contents: read

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/easy-capture-parser.js
          node --check assets/js/easy-capture-enhancements.js
      - name: Run receipt parser regression tests
        run: node tests/easy-capture-parser.test.cjs
