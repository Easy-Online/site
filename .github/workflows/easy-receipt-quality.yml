name: Easy Receipt quality gate

on:
  pull_request:
    paths:
      - "easy-receipt.html"
      - "easy-capture.html"
      - "scripts/test-easy-receipt-quality.js"
      - ".github/workflows/easy-receipt-quality.yml"
  push:
    branches: [main]
    paths:
      - "easy-receipt.html"
      - "easy-capture.html"
      - "scripts/test-easy-receipt-quality.js"

permissions:
  contents: read

jobs:
  receipt-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Easy Receipt regression checks
        run: node scripts/test-easy-receipt-quality.js
