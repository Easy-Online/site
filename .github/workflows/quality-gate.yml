name: EasyFile Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate source integrity
        run: node tools/validate-source-integrity.js

      - name: Enforce canonical navigation
        run: node tools/inject-nav.js

      - name: Validate document structure and inline scripts
        run: node tools/validate-html.js

      - name: Install HTMLHint
        run: npm install --global htmlhint

      - name: Validate HTML conventions
        run: htmlhint --config .htmlhintrc ./*.html

      - name: Validate JavaScript syntax
        run: |
          find tools scripts assets/js referral-api/src referral-api/test -type f \
            \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 \
            | xargs -0 -r -n1 node --check

      - name: Verify platform conformance
        run: node scripts/verify-platform-conformance.js

      - name: Start static-site smoke test
        run: |
          python3 -m http.server 8080 > /tmp/easyfile-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/index.html > /dev/null; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              cat /tmp/easyfile-http.log
              exit 1
            fi
            sleep 1
          done

          for page in index.html easy-*.html; do
            echo "Smoke testing $page"
            curl --fail --silent --show-error "http://127.0.0.1:8080/$page" > /dev/null
          done

      - name: Upload validated site
        uses: actions/upload-artifact@v4
        with:
          name: easyfile-site
          path: |
            ./*.html
            ./assets
            ./scripts
            ./partials
            ./*.png
            ./*.svg
            ./sitemap.xml
            ./robots.txt
          if-no-files-found: error
