<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Easy Save | EasyFile</title>
  <meta name="description" content="Select files or website links and save them to browser storage, Google Drive, OneDrive, Dropbox, Box, FTP/SFTP or S3-compatible cloud storage through EasyFile storage connectors.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="logo-b.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/easyfile-brand-tokens.css">
  <link rel="stylesheet" href="assets/css/easyfile-site.css">
  <link rel="stylesheet" href="assets/css/easyfile-footer.css">
  <link rel="stylesheet" href="assets/css/easyfile-navigation.css">
  <style>
    :root {
      --save-blue-soft: #eff6ff;
      --save-blue-border: #bfdbfe;
      --save-green-soft: #dcfce7;
      --save-amber-soft: #fef3c7;
      --save-danger-soft: #fee2e2;
    }

    .save-module-header {
      border-bottom: 1px solid var(--easyfile-border);
      background: color-mix(in srgb, var(--easyfile-surface) 96%, transparent);
      box-shadow: 0 5px 20px rgba(15, 23, 42, .04);
      backdrop-filter: blur(12px);
    }
    .save-module-icon {
      width: 2.75rem;
      height: 2.75rem;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: .75rem;
      background: var(--easyfile-blue);
      color: #fff;
      font-weight: 900;
      box-shadow: 0 8px 22px rgba(37, 99, 235, .18);
    }
    .save-module-subtitle { color: var(--easyfile-muted); }
    .save-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
    .save-chip {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1px solid var(--easyfile-border);
      border-radius: 999px;
      padding: .38rem .65rem;
      background: var(--easyfile-surface);
      color: var(--easyfile-muted);
      font-size: .75rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .save-shell { padding-top: 1.75rem; padding-bottom: 4rem; }
    .save-card {
      border: 1px solid var(--easyfile-border);
      border-radius: var(--easyfile-radius);
      background: var(--easyfile-surface);
      color: var(--easyfile-text);
      box-shadow: var(--easyfile-shadow);
    }
    .save-intro {
      position: relative;
      overflow: hidden;
      padding: 1.4rem;
    }
    .save-intro::after {
      content: "";
      position: absolute;
      width: 18rem;
      height: 18rem;
      right: -8rem;
      top: -10rem;
      border-radius: 999px;
      background: rgba(37, 99, 235, .08);
      pointer-events: none;
    }
    .save-intro-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(18rem, .75fr);
      gap: 1.5rem;
      align-items: center;
    }
    .save-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      color: var(--easyfile-blue);
      font-size: .75rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .save-intro h2 {
      margin: .35rem 0 0;
      color: var(--easyfile-text);
      font-size: clamp(1.55rem, 3vw, 2.25rem);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -.035em;
    }
    .save-intro-copy {
      max-width: 52rem;
      margin: .6rem 0 0;
      color: var(--easyfile-muted);
      font-size: .92rem;
      line-height: 1.65;
    }
    .save-flow { display: grid; gap: .55rem; }
    .save-flow-item {
      display: flex;
      align-items: center;
      gap: .7rem;
      border: 1px solid var(--easyfile-border);
      border-radius: .75rem;
      padding: .7rem .8rem;
      background: var(--easyfile-surface);
      font-size: .82rem;
    }
    .save-flow-item span {
      width: 1.8rem;
      height: 1.8rem;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: .55rem;
      background: var(--save-blue-soft);
      color: #1d4ed8;
      font-size: .75rem;
      font-weight: 900;
    }

    .save-section { margin-top: 1.25rem; overflow: hidden; }
    .save-section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.05rem 1.15rem;
      border-bottom: 1px solid var(--easyfile-border);
      background: rgba(248, 250, 252, .72);
    }
    .save-section-head h2 { margin: 0; font-size: 1rem; font-weight: 900; }
    .save-section-head p { margin: .2rem 0 0; color: var(--easyfile-muted); font-size: .8rem; }
    .save-section-body { padding: 1.15rem; }

    .provider-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .75rem; }
    .provider {
      position: relative;
      min-height: 9.5rem;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--easyfile-border);
      border-radius: .85rem;
      padding: .9rem;
      background: var(--easyfile-surface);
      color: var(--easyfile-text);
      text-align: left;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background-color .15s ease;
    }
    .provider:hover { transform: translateY(-1px); border-color: #93c5fd; box-shadow: 0 10px 24px rgba(37, 99, 235, .09); }
    .provider.is-selected { border-color: var(--easyfile-blue); background: var(--save-blue-soft); box-shadow: 0 0 0 3px rgba(37, 99, 235, .11); }
    .provider-top { display: flex; justify-content: space-between; gap: .65rem; align-items: flex-start; }
    .provider-icon {
      width: 2.45rem;
      height: 2.45rem;
      display: grid;
      place-items: center;
      border-radius: .7rem;
      background: var(--save-blue-soft);
      color: #2563eb;
      font-size: 1.05rem;
    }
    .provider.is-selected .provider-icon { background: #dbeafe; }
    .provider h3 { margin: .75rem 0 .25rem; font-weight: 900; font-size: .93rem; }
    .provider p { margin: 0; color: var(--easyfile-muted); font-size: .76rem; line-height: 1.45; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border-radius: 999px;
      padding: .24rem .5rem;
      font-size: .67rem;
      font-weight: 900;
      white-space: nowrap;
    }
    .status.local { background: var(--save-green-soft); color: #166534; }
    .status.connector { background: #dbeafe; color: #1d4ed8; }
    .status.direct { background: var(--save-amber-soft); color: #92400e; }

    .source-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .drop-zone {
      min-height: 14rem;
      display: grid;
      place-items: center;
      border: 2px dashed var(--save-blue-border);
      border-radius: .9rem;
      padding: 1.4rem;
      background: rgba(239, 246, 255, .72);
      color: var(--easyfile-text);
      text-align: center;
      cursor: pointer;
      transition: border-color .15s ease, background-color .15s ease, transform .15s ease;
    }
    .drop-zone:hover { border-color: #60a5fa; transform: translateY(-1px); }
    .drop-zone.drag { border-color: var(--easyfile-blue); background: #dbeafe; }
